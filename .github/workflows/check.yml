name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m bench.catalog cases/catalog.json
      - run: python3 -c "import ast, pathlib; [ast.parse(p.read_text()) for root in ('bench', 'tests') for p in pathlib.Path(root).rglob('*.py')]"
      - run: git diff --check HEAD^ HEAD
