name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    if: >-
      github.event.repository.private &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, autonomy-agent-bench]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m bench.catalog cases/catalog.json
      - run: python3 -c "import ast, pathlib; [ast.parse(p.read_text()) for root in ('bench', 'tests') for p in pathlib.Path(root).rglob('*.py')]"
      - run: git diff --check HEAD^ HEAD
